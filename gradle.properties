# Required whenever any androidx.* dependency is present — the build fails at
# checkReleaseAarMetadata without it, listing every AndroidX artifact it found.
android.useAndroidX=true

# Nothing here uses the old support library, so there is no need to rewrite
# dependencies at build time. Leaving it off keeps builds noticeably faster.
android.enableJetifier=false

# CI runners have memory; give the Gradle daemon enough that a release build
# doesn't fall over compiling Kotlin.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
kotlin.code.style=official
