---
# Builds VibeForge itself. Any project you push with VibeForge needs a workflow
# like this one — VibeForge triggers it, it does the work, and it publishes an
# APK to a release so the phone has something to download.

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "Using the persistent keystore."
          else
            echo "::warning::No KEYSTORE_B64 secret — this APK will not install over a previous build."
            keytool -genkeypair -v \
              -keystore app/release.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VibeForge, OU=VibeForge, O=VibeForge, L=Phone, S=NA, C=US"
          fi

      - name: Build
        env:
          VIBEFORGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIBEFORGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIBEFORGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version=8.2
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # A green build with nothing to install is the worst outcome, because it
      # looks like success. Say exactly what was produced, and fail loudly if
      # it was nothing.
      - name: Collect APK
        id: collect
        run: |
          echo "--- everything under app/build/outputs ---"
          find app/build/outputs -type f -name '*.apk' -printf '%p  %s bytes\n' || true

          SRC=$(find app/build/outputs -type f -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::assembleRelease finished but produced no APK."
            exit 1
          fi

          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          OUT="VibeForge-$SHORT.apk"
          cp "$SRC" "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "Collected $OUT ($(stat -c%s "$OUT") bytes) from $SRC"

      # Two delivery routes on purpose. The release is what the phone reads;
      # the artifact is the fallback when release creation is refused, which
      # happens on repositories with restricted workflow permissions.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: VibeForge-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest VibeForge build
          body: Built from `${{ github.sha }}`.
          files: VibeForge-*.apk
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Where to get it
        run: |
          echo "Release: ${{ steps.release.outputs.url }}"
          echo "APK:     ${{ steps.collect.outputs.name }}"
          echo "If the release link is empty, use the 'apk' artifact on this run page."
